<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">Ancestral Shards</div>
    <p class="auth-subtitle">Entre para continuar sua mineração.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email"
               [class.is-invalid]="submitted() && f.email.errors" />
        @if (submitted() && f.email.errors) {
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        }
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <div class="input-group has-validation">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" class="form-control"
                 formControlName="password" autocomplete="current-password"
                 [class.is-invalid]="submitted() && f.password.errors" />
          <button type="button" class="btn btn-outline-secondary" (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'">
            <i class="bi" [class.bi-eye]="!showPassword()" [class.bi-eye-slash]="showPassword()"></i>
          </button>
          @if (submitted() && f.password.errors) {
            <div class="invalid-feedback">A senha deve ter de 4 a 30 caracteres.</div>
          }
        </div>
      </div>

      <div class="form-check mb-3">
        <input id="remember" type="checkbox" class="form-check-input" formControlName="rememberMe" />
        <label for="remember" class="form-check-label small">Lembrar-me</label>
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2 small" role="alert">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn btn-auth" [disabled]="loading()">
        @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span>Entrando... } @else { Entrar }
      </button>

      <p class="text-center small mt-3 mb-0">
        Novo por aqui? <a routerLink="/user/signup" class="auth-link">Cadastre-se</a>
      </p>
    </form>
  </div>
</div>
